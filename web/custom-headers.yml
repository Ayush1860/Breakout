# HTTP response headers for the live site, applied to the Amplify app with
#   aws amplify update-app --app-id <APP_ID> --region ap-south-1 --custom-headers file://web/custom-headers.yml
# (see docs/aws-setup.md). The CI deploy role can't change these on purpose.
#
# The page has no inline scripts (web/pre.js) and the build uses no eval
# (-sDYNAMIC_EXECUTION=0), so scripts are limited to this site's own files.
# 'wasm-unsafe-eval' only allows compiling WebAssembly, not JavaScript eval.
# Inline styles are allowed because the page's small stylesheet is inline.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
